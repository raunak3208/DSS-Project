---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: aiops}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    scrape_configs:
      - job_name: services
        static_configs:
          - targets: ["gateway:8000", "user-service:8000", "order-service:8000", "payment-service:8000", "notification-service:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: aiops}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
      volumes: [{name: cfg, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: aiops}
spec: {selector: {app: prometheus}, ports: [{port: 9090}]}

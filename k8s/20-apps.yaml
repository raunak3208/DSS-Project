    metadata: {labels: {app: loadgen}}
    spec:
      containers:
        - name: loadgen
          image: aiops/svc:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/loadgen.py"]
          env:
            - {name: TARGET, value: "http://gateway:8000"}
            - {name: LOAD_RPS, value: "6"}
          resources: {limits: {memory: 384Mi}}

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: aiops, labels: {app: gateway}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: aiops/svc:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: MEM_LIMIT_MB, value: "256"}
            - {name: SERVICE_NAME, value: "gateway"}
          resources: {limits: {memory: 384Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: aiops}
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]

# AIOps closed-loop prototype.  Run:  cp .env.example .env && docker compose up --build
x-svc: &svc
  build: { context: ., dockerfile: services/Dockerfile }
  restart: "no"                    # a crashed service stays down until the agent (or you) restarts it
  mem_limit: 384m
  depends_on: { kafka: { condition: service_healthy }, redis: { condition: service_healthy } }
x-env: &env
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_URL: redis://redis:6379/0
  MEM_LIMIT_MB: "256"

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MINUTES: 30
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  # ---------------- microservices (one image, SERVICE_NAME picks the role) ----------------
  gateway:
    <<: *svc
    container_name: gateway
    environment: { <<: *env, SERVICE_NAME: gateway }
    ports: ["8000:8000"]
  user-service:
    <<: *svc
    container_name: user-service
    environment: { <<: *env, SERVICE_NAME: user-service }
  order-service:
    <<: *svc
    container_name: order-service
    environment: { <<: *env, SERVICE_NAME: order-service }
  payment-service:
    <<: *svc
    container_name: payment-service
    environment: { <<: *env, SERVICE_NAME: payment-service }
  notification-service:
    <<: *svc
    container_name: notification-service
    environment: { <<: *env, SERVICE_NAME: notification-service }

  loadgen:
    <<: *svc
    container_name: loadgen
    restart: unless-stopped
    command: ["python", "/app/loadgen.py"]
    environment: { TARGET: "http://gateway:8000", LOAD_RPS: "${LOAD_RPS:-6}" }
    depends_on: [gateway, order-service, user-service, payment-service, notification-service]

  # ---------------- AIOps pipeline ----------------
  processor:
    build: { context: ., dockerfile: processor/Dockerfile }
    container_name: processor
    restart: unless-stopped
    environment: *env
    depends_on: { kafka: { condition: service_healthy }, redis: { condition: service_healthy } }

  controller:
    build: { context: ., dockerfile: controller/Dockerfile }
    container_name: controller
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/aiops.db
    volumes:
      - controller-data:/data
      - /var/run/docker.sock:/var/run/docker.sock     # lets the executor restart containers (never exposed to the LLM)
    extra_hosts: ["host.docker.internal:host-gateway"] # reach Ollama running on the host
    ports: ["8080:8080"]
    depends_on: { kafka: { condition: service_healthy }, redis: { condition: service_healthy } }

  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [controller]

  # ---------------- observability ----------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  controller-data:
